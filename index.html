<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>挂单能不能赚钱</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%89%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%89%3C/text%3E%3C/svg%3E">
<style>
:root{--ground:#f2f3f5;--card:#fff;--ink:#14181e;--ink2:#3d4550;--muted:#68717e;
 --hair:#e2e5e9;--hair2:#eef0f3;--accent:#b8762a;--accent-soft:#b8762a1f;
 --good:#1a7a52;--bad:#c53a1c;--good-soft:#1a7a5218;--bad-soft:#c53a1c18;
 --shadow:0 1px 2px #14181e0a,0 8px 24px #14181e0a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
 --ground:#14181e;--card:#1c212a;--ink:#e6e9ee;--ink2:#c2c9d3;--muted:#8c95a3;
 --hair:#2a313c;--hair2:#232935;--accent:#d99748;--accent-soft:#d9974826;
 --good:#35a37f;--bad:#e06a4e;--good-soft:#35a37f22;--bad-soft:#e06a4e22;
 --shadow:0 1px 2px #0006,0 8px 24px #0004}}
:root[data-theme=dark]{--ground:#14181e;--card:#1c212a;--ink:#e6e9ee;--ink2:#c2c9d3;
 --muted:#8c95a3;--hair:#2a313c;--hair2:#232935;--accent:#d99748;--accent-soft:#d9974826;
 --good:#35a37f;--bad:#e06a4e;--good-soft:#35a37f22;--bad-soft:#e06a4e22;
 --shadow:0 1px 2px #0006,0 8px 24px #0004}
*{box-sizing:border-box}
/* ★[hidden] 必须 !important:#lock 的 display:flex 与 .wrap 的 display:flex
   选择器优先级都高过 UA 的 [hidden]{display:none},不加 !important 时
   设了 hidden 属性元素照样显示 —— 解锁后锁屏不消失。 */
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);margin:0;font-size:16px;line-height:1.65;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
 "Microsoft YaHei","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 72px;display:flex;
 flex-direction:column;gap:18px}
.num{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
 font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1{font-size:27px;line-height:1.25;margin:0;letter-spacing:-.022em;font-weight:700;
 text-wrap:balance}
h2{font-size:13px;margin:0 0 14px;letter-spacing:.09em;text-transform:uppercase;
 color:var(--muted);font-weight:600}
p{margin:0}
.card{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:20px;
 box-shadow:var(--shadow)}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
 font-size:12.5px;font-weight:600;border:1px solid}
.pill.run{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.pill.stop{color:var(--muted);border-color:var(--hair);background:var(--hair2)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.run .dot{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.verdict{font-size:20px;line-height:1.5;font-weight:600;letter-spacing:-.011em;text-wrap:pretty}
.verdict em{font-style:normal}.verdict em.bad{color:var(--bad)}.verdict em.good{color:var(--good)}
.sub{color:var(--ink2);font-size:15px;margin-top:12px;text-wrap:pretty}
.explain{color:var(--ink2);font-size:15px;display:flex;flex-direction:column;gap:11px}
.explain b{color:var(--ink);font-weight:650}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;background:var(--hair2);
 border:1px solid var(--hair);border-radius:5px;padding:1px 6px}
.row{padding:16px 0;border-top:1px solid var(--hair2)}
.row:first-child{border-top:0;padding-top:2px}
.rowhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.rowname{font-weight:650;font-size:15.5px}
.rowval{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
.big{font-size:23px;font-weight:700}.big.good{color:var(--good)}.big.bad{color:var(--bad)}
.tag{font-size:12px;font-weight:650;padding:2px 7px;border-radius:5px}
.tag.good{color:var(--good);background:var(--good-soft)}
.tag.bad{color:var(--bad);background:var(--bad-soft)}
.bar{height:7px;border-radius:4px;background:var(--hair2);margin:11px 0 9px;position:relative;
 overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:4px;display:block}
.bar .exp{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.75}
.why{color:var(--muted);font-size:13.5px;display:flex;justify-content:space-between;gap:12px;
 flex-wrap:wrap}.why span:last-child{white-space:nowrap}
figure{margin:0}figcaption{color:var(--muted);font-size:13px;margin-top:10px;text-wrap:pretty}
svg{display:block;width:100%;height:auto;overflow:visible}
.chartbox{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--card);color:var(--ink);
 border:1px solid var(--hair);border-radius:8px;padding:7px 10px;font-size:12.5px;
 box-shadow:var(--shadow);white-space:nowrap;opacity:0;transition:opacity .1s;top:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:right;color:var(--muted);font-weight:600;font-size:12px;padding:0 0 9px;
 letter-spacing:.04em;text-transform:uppercase}
th:first-child,td:first-child{text-align:left}
td{padding:9px 0;border-top:1px solid var(--hair2);text-align:right}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fact{display:flex;flex-direction:column;gap:3px}
.fact .l{color:var(--muted);font-size:12.5px}.fact .v{font-size:19px;font-weight:700}
.note{color:var(--muted);font-size:13px;text-wrap:pretty}
.warn{border-left:3px solid var(--accent);background:var(--accent-soft);padding:13px 15px;
 border-radius:0 8px 8px 0;color:var(--ink2);font-size:14.5px;text-wrap:pretty}
/* 锁屏 */
#lock{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
#lock .card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
input[type=password]{width:100%;padding:12px 14px;font-size:16px;border-radius:9px;
 border:1px solid var(--hair);background:var(--ground);color:var(--ink);
 font-family:ui-monospace,Menlo,monospace}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{padding:12px 14px;font-size:15px;font-weight:650;border-radius:9px;border:0;
 background:var(--ink);color:var(--card);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.err{color:var(--bad);font-size:13.5px;min-height:1.2em}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--hair);
 font-size:12.5px;padding:5px 11px;font-weight:600}
@media(max-width:560px){h1{font-size:23px}.verdict{font-size:18px}.big{font-size:20px}
 .wrap{padding:20px 14px 56px;gap:14px}.card{padding:17px}.facts{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<div id="lock"><form class="card" id="lockform">
  <h1 style="font-size:20px">挂单能不能赚钱</h1>
  <p class="note">数据是加密存的。密码只在这台设备上用来解密,不会上传。</p>
  <input type="password" id="pw" placeholder="密码" autocomplete="current-password" autofocus>
  <button type="submit" id="go">解锁</button>
  <p class="err" id="err"></p>
</form></div>

<div class="wrap" id="app" hidden></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let PW=sessionStorage.getItem("pw")||"", timer=null;

async function decrypt(env,pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",
    false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64(env.salt),iterations:env.iter,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.iv)},key,b64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function load(pw){
  const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("拿不到数据 ("+r.status+")");
  return decrypt(await r.json(),pw);
}
$("#lockform").addEventListener("submit",async e=>{
  e.preventDefault(); const pw=$("#pw").value; $("#go").disabled=true;
  $("#err").textContent="解密中…";
  try{ const d=await load(pw); PW=pw; sessionStorage.setItem("pw",pw);
       $("#err").textContent=""; $("#pw").value="";
       $("#lock").hidden=true; $("#app").hidden=false; render(d); schedule(); }
  catch(_){ $("#err").textContent="密码不对"; $("#go").disabled=false; $("#pw").select(); }
});
function schedule(){ clearInterval(timer); timer=setInterval(async()=>{
  try{ render(await load(PW)); }catch(_){}
},30000); }
if(PW) load(PW).then(d=>{$("#lock").hidden=true;$("#app").hidden=false;render(d);schedule();})
              .catch(()=>sessionStorage.removeItem("pw"));

/* ---------------- 渲染 ---------------- */
const F={ fill_rate:{n:"挂出去的单,多少真成交了",f:v=>(v*100).toFixed(0)+"%",
   w:"越高说明越容易成交",b:"high",s:1},
 wait:{n:"从挂单到成交,等多久",f:v=>v.toFixed(1)+" 秒",
   w:"等越久,越是只在价格朝你不利时才被吃",b:"low",s:40},
 drift:{n:"成交那一刻,对面价格跑掉了多少",f:v=>v.toFixed(2)+" bp",
   w:"挂单的隐形成本,预演最算不准的一项",b:"high",s:4},
 net:{n:"一来一回,实际赚还是亏",f:v=>(v>0?"+":"")+v.toFixed(2)+" bp",
   w:"扣完手续费和上面那项之后的净结果",b:"high",s:3}};
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function render(D){
  const m=D.metrics||{}, net=(m.net||{}).got, wait=(m.wait||{}).got;
  const ago=Math.max(0,Math.round(Date.now()/1000-(D.generated_ts||0)));
  let verdict, sub;
  if(!D.n){ verdict='还没有跑过任何一轮。'; sub='等实测开始后这里会出结果。'; }
  else{
    verdict='跑了 <span class="num">'+D.n+'</span> 轮。每做一次'+
      (net>0?'<em class="good">赚 '+net.toFixed(2)+'</em>':'<em class="bad">亏 '+
       Math.abs(net).toFixed(2)+'</em>')+' 个万分点,预演算出来应该是赚 1.06。';
    sub=(wait>12?'差在哪很清楚:<b>挂出去的单要等 '+wait.toFixed(0)+
      ' 秒才成交,预演以为只要 9 秒</b>。等得越久,越是只在价格朝你不利时才被吃掉——'+
      '这一段预演算不出来,只能真金实测。':'成交比预演还快。')+
      ' 不过 '+D.n+' 轮什么都说明不了,得攒到十几轮才有意义。';
  }
  let rows="";
  for(const k of ["fill_rate","wait","drift","net"]){
    const s=F[k], g=(m[k]||{}).got, e=(m[k]||{}).exp;
    if(g==null) continue;
    const good=s.b==="high"?g>=e:g<=e, cls=good?"good":"bad";
    const pct=v=>Math.max(2,Math.min(100,Math.abs(v)/s.s*100));
    rows+='<div class="row"><div class="rowhead"><span class="rowname">'+s.n+'</span>'+
      '<span class="rowval"><span class="big num '+cls+'">'+s.f(g)+'</span>'+
      '<span class="tag '+cls+'">'+(good?"好过预演":"差于预演")+'</span></span></div>'+
      '<div class="bar"><i style="left:0;width:'+pct(g)+'%;background:var(--'+cls+')"></i>'+
      '<span class="exp" style="left:'+pct(e)+'%"></span></div>'+
      '<div class="why"><span>'+s.w+'</span><span class="num">预演 '+s.f(e)+'</span></div></div>';
  }
  const live=D.live||{}, acc=D.account||{};
  const dirty=(acc.positions||0)+(acc.orders||0)>0;
  $("#app").innerHTML=
   '<header style="display:flex;flex-direction:column;gap:10px">'+
   '<h1>挂单能不能赚钱</h1><div class="meta">'+
   '<span class="pill '+(D.running?"run":"stop")+'"><i class="dot"></i>'+
     (D.running?"实测进行中":"已暂停")+'</span>'+
   '<span>'+(ago<90?ago+" 秒前更新":Math.round(ago/60)+" 分钟前更新")+'</span>'+
   '<button class="ghost" onclick="sessionStorage.removeItem(\'pw\');location.reload()">锁定</button>'+
   '</div></header>'+
   '<section class="card"><p class="verdict">'+verdict+'</p><p class="sub">'+sub+'</p></section>'+
   '<section class="card"><h2>这在测什么</h2><div class="explain">'+
   '<p>同一个比特币,在 <b>PopDEX</b> 上比在 <b>Lighter</b> 上便宜一点点。'+
   '理论上:在便宜的地方挂单买、在贵的地方同时卖,赚中间那点差价。</p>'+
   '<p>问题是"挂单"不保证成交。<b>你的单被吃掉,往往正是因为价格开始朝你不利的方向走</b>——'+
   '等你成交时,另一边的价格已经跑掉了。这笔隐形成本没人能靠历史数据算准,'+
   '所以拿 200 美元一单去实测。</p>'+
   '<p class="note">下面反复出现的 <span class="kbd">bp</span> 是万分之一。'+
   '1 bp 在 200 美元上 = 0.02 美元。手续费一来一回是 2 bp,所以差价得先超过 2 bp 才谈得上赚。</p>'+
   '</div></section>'+
   (rows?'<section class="card"><h2>四个数 · 实测 vs 预演</h2>'+rows+'</section>':'')+
   '<section class="card"><figure><h2>这几天差价还在不在</h2>'+
   '<div class="chartbox"><div class="tip" id="tip"></div><div id="chart"></div></div>'+
   '<figcaption>每小时一个点,按 20 万美元规模算,已扣手续费。横线以上才有得赚。'+
   (live.net_bp!=null?'<b> 此刻 '+(live.net_bp>0?"+":"")+live.net_bp+' bp</b>。':'')+
   ' 上面"价格跑掉"的成本约 1.3 bp,所以差价掉到 1 以下时做一次基本是白忙。'+
   '</figcaption></figure></section>'+
   '<section class="card"><h2>钱和安全</h2><div class="facts">'+
   '<div class="fact"><span class="l">这次实测花了</span><span class="v num" style="color:var(--bad)">'+
     (D.cash||0).toFixed(2)+' 美元</span></div>'+
   '<div class="fact"><span class="l">每轮固定成本</span><span class="v num">4.2 bp</span></div>'+
   '<div class="fact"><span class="l">账户里还挂着的单</span><span class="v num" style="color:var(--'+
     (dirty?"bad":"good")+')">'+(acc.orders??"?")+' 笔</span></div>'+
   '<div class="fact"><span class="l">还没平掉的仓位</span><span class="v num" style="color:var(--'+
     (dirty?"bad":"good")+')">'+(acc.positions??"?")+' 笔</span></div>'+
   '</div><p class="note" style="margin-top:15px">这点钱是<b>测量的价钱,不是策略亏了</b>:'+
   '每轮开仓挂单收 1 bp、平仓吃单收 3.2 bp,本来就要付。</p></section>'+
   (D.cycles&&D.cycles.length?'<section class="card"><h2>每一轮</h2><div class="scroll">'+
   '<table><thead><tr><th>轮次</th><th>结果</th><th>等待</th><th>价格跑掉</th><th>净结果</th>'+
   '<th>现金</th></tr></thead><tbody>'+D.cycles.map(c=>
     '<tr><td class="num">'+c.i+'</td><td>'+(c.o==="filled"?"成交 · "+esc(c.scope):"没成交")+
     '</td><td class="num">'+c.w+'s</td><td class="num">'+c.d.toFixed(2)+'</td>'+
     '<td class="num" style="color:var(--'+(c.net>0?"good":"bad")+')">'+
     (c.net>0?"+":"")+c.net.toFixed(2)+'</td><td class="num">'+c.cash.toFixed(4)+
     '</td></tr>').join("")+'</tbody></table></div></section>':'')+
   '<section class="warn"><b>别急着下结论。</b>现在只有 '+D.n+' 轮。要判断"挂单到底多久成交、'+
   '被吃掉时亏多少",至少得十几轮,而且要覆盖价格上行和下行两种时段——'+
   '只在单边下跌时挂买单,当然次次都成交。</section>'+
   '<p class="note">数据每 2 分钟由首尔服务器加密后推送。密码只在本机解密,从不上传。</p>';
  chart(D.hourly||[]);
}

function chart(h){
  const el=$("#chart"); if(!el||!h.length){ if(el) el.textContent=""; return; }
  const W=680,H=230,P={t:14,r:14,b:26,l:38};
  const xs=i=>P.l+(W-P.l-P.r)*(h.length<2?0:i/(h.length-1));
  const vals=h.map(d=>d.med), lo=Math.min(-0.6,...vals), hi=Math.max(...vals);
  const ys=v=>P.t+(H-P.t-P.b)*(1-(v-lo)/(hi-lo||1));
  const line=h.map((d,i)=>(i?"L":"M")+xs(i).toFixed(1)+" "+ys(d.med).toFixed(1)).join(" ");
  let grid="";
  for(const v of [0,2,4,6]) if(v>=lo&&v<=hi)
    grid+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+ys(v)+'" y2="'+ys(v)+
     '" stroke="var(--hair)" stroke-width="1"/><text x="'+(P.l-8)+'" y="'+(ys(v)+4)+
     '" text-anchor="end" font-size="11" fill="var(--muted)" '+
     'font-family="ui-monospace,Menlo,monospace">'+v+'</text>';
  const ticks=[0,h.length>>1,h.length-1].map(i=>'<text x="'+xs(i)+'" y="'+(H-6)+
    '" text-anchor="middle" font-size="11" fill="var(--muted)">'+esc(h[i].h.slice(0,5))+
    '</text>').join("");
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="每小时差价走势">'+
   '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">'+
   '<stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/>'+
   '<stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>'+
   grid+'<path d="'+line+' L'+xs(h.length-1).toFixed(1)+' '+ys(lo).toFixed(1)+' L'+
   xs(0).toFixed(1)+' '+ys(lo).toFixed(1)+' Z" fill="url(#g)"/>'+
   '<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2" '+
   'stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+xs(h.length-1)+'" cy="'+
   ys(h[h.length-1].med)+'" r="4.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>'+
   '<line id="cross" x1="0" x2="0" y1="'+P.t+'" y2="'+(H-P.b)+'" stroke="var(--muted)" '+
   'stroke-width="1" stroke-dasharray="3 3" opacity="0"/>'+ticks+'</svg>';
  const svg=el.querySelector("svg"),tip=$("#tip"),cross=$("#cross"),box=el.parentElement;
  const move=e=>{const r=svg.getBoundingClientRect();
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    let i=Math.round(((cx-r.left)/r.width*W-P.l)/((W-P.l-P.r)/(h.length-1||1)));
    i=Math.max(0,Math.min(h.length-1,i)); const d=h[i];
    cross.setAttribute("x1",xs(i)); cross.setAttribute("x2",xs(i));
    cross.setAttribute("opacity","1");
    tip.textContent=d.h+" · "+(d.med>0?"+":"")+d.med.toFixed(2)+" bp · 为正 "+
      Math.round(d.pos*100)+"%";
    tip.style.opacity="1";
    tip.style.left=Math.max(4,Math.min(r.width-tip.offsetWidth-4,
      xs(i)/W*r.width-tip.offsetWidth/2))+"px";};
  ["mousemove","touchmove","touchstart"].forEach(ev=>box.addEventListener(ev,move,{passive:true}));
  ["mouseleave","touchend"].forEach(ev=>box.addEventListener(ev,()=>{
    tip.style.opacity="0";cross.setAttribute("opacity","0");}));
}
</script></body></html>
